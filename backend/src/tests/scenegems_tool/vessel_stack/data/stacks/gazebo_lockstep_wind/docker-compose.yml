services:
  agent_0:
    image: ${SITL_IMAGE:-scenegems-ardupilot-sitl:latest}
    restart: unless-stopped
    environment:
    - SITL_SIMULATOR=gazebo
    - SITL_VEHICLE=Rover
    - SITL_FRAME=motorboat
    - SITL_PARAM_FILE=<backend>/assets/runtime_assets/scenario_execution/gen_tmp/params-agent_0.params
    - SITL_NO_MAVPROXY=1
    - SITL_NO_REBUILD=1
    - SITL_SPEEDUP=1
    - SITL_CUSTOM_LOCATION=57.757128,16.673189,0,0
    - SITL_SYSID=1
    - SITL_INSTANCE=0
    - SITL_RESOLVE_HOST=gazebo
    - SITL_MODEL=JSON
    volumes:
    - scenegems_runtime_assets:<backend>/assets/runtime_assets:ro
    entrypoint:
    - /bin/bash
    - -c
    - 'set -euo pipefail

      tr -d ''\r'' < /scripts/sitl_entrypoint.sh > /tmp/sitl_entrypoint.sh

      chmod +x /tmp/sitl_entrypoint.sh

      exec /tmp/sitl_entrypoint.sh'
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - maritime_net
  agent_0_asv_system:
    image: ${SCENARIO_EXECUTION_IMAGE:-scenegems-scenario-execution-subsystem:latest}
    command:
    - python
    - -m
    - scenegems_tool.vessel_stack.asv_system.replay.replay_server
    - --port
    - '11410'
    environment:
      PYTHONUNBUFFERED: '1'
    networks:
    - maritime_net
  agent_1:
    image: ${SITL_IMAGE:-scenegems-ardupilot-sitl:latest}
    restart: unless-stopped
    environment:
    - SITL_SIMULATOR=gazebo
    - SITL_VEHICLE=Rover
    - SITL_FRAME=motorboat
    - SITL_PARAM_FILE=<backend>/assets/runtime_assets/scenario_execution/gen_tmp/params-agent_1.params
    - SITL_NO_MAVPROXY=1
    - SITL_NO_REBUILD=1
    - SITL_SPEEDUP=1
    - SITL_CUSTOM_LOCATION=57.757128,16.673189,0,0
    - SITL_SYSID=2
    - SITL_INSTANCE=1
    - SITL_RESOLVE_HOST=gazebo
    - SITL_MODEL=JSON
    volumes:
    - scenegems_runtime_assets:<backend>/assets/runtime_assets:ro
    entrypoint:
    - /bin/bash
    - -c
    - 'set -euo pipefail

      tr -d ''\r'' < /scripts/sitl_entrypoint.sh > /tmp/sitl_entrypoint.sh

      chmod +x /tmp/sitl_entrypoint.sh

      exec /tmp/sitl_entrypoint.sh'
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - maritime_net
  agent_1_asv_system:
    image: ${SCENARIO_EXECUTION_IMAGE:-scenegems-scenario-execution-subsystem:latest}
    command:
    - python
    - -m
    - scenegems_tool.vessel_stack.asv_system.replay.replay_server
    - --port
    - '11410'
    environment:
      PYTHONUNBUFFERED: '1'
    networks:
    - maritime_net
  gazebo:
    image: ${GAZEBO_IMAGE:-scenegems-gazebo-harmonic:latest}
    hostname: gazebo
    environment:
      GZ_HEADLESS: '1'
      GZ_VERBOSE: '4'
      DISPLAY: host.docker.internal:0.0
      QT_X11_NO_MITSHM: '1'
      WORLD_SDF: <backend>/assets/runtime_assets/scenario_execution/gen_tmp/ocean_world.sdf
    volumes:
    - scenegems_runtime_assets:<backend>/assets/runtime_assets:ro
    entrypoint:
    - /bin/bash
    - -c
    - 'set -euo pipefail

      tr -d ''\r'' < /scripts/entrypoint.sh > /tmp/entrypoint.sh

      chmod +x /tmp/entrypoint.sh

      exec /tmp/entrypoint.sh'
    networks:
    - maritime_net
    depends_on:
    - agent_0
    - agent_1
networks:
  maritime_net:
    name: asv_maritime_net
    driver: bridge
volumes:
  scenegems_runtime_assets:
    external: true
