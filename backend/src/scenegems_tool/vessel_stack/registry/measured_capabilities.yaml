# Measured capability values of the vessel stack specs.
#
# This file is the only place for measured numbers. Specs in code declare structural
# capabilities and conservative defaults; an entry here replaces the named capability
# fields of the spec with the same id when the registry is built.
#
# Keys are spec ids: "<role>/<impl>" for a layer (for example simulation_layer/gazebo),
# the adapter id for an adapter. Measurements of a control and simulation pair go on the
# adapter that links the two (for example sitl_internal_physics for ardupilot_sim with
# the ardupilot control layer).
#
# Fields, all optional:
#   repeatability_tier     exact | bounded | none
#   exact_up_to_speedup    a bounded stack that was measured bit-identical up to this speedup
#   max_speedup            highest speedup measured to track the request; .inf means no limit
#                          of its own; null means not measured, or measured per host only
#   host_max_speedup       {host label: max speedup} where the pace depends on the machine;
#                          applies when the resolver is told the host, otherwise it warns
#   lockstep, faster_than_real_time   true | false, when a measurement overrides the declaration
#   wind, waves            supported | unmeasured | unsupported
#   notes                  {capability field: reason shown when that field rejects a request}
#   deviation_bounds_m     {speedup: max trajectory deviation in meters} behind a bounded tier
#   deviation_bounds_m_by_layer   {simulation layer spec id: {speedup: max deviation in meters}} for
#                          an adapter measured on chains through several simulation layers
#   evidence               how and when the values were measured
#
# Phase 0 measurements, 2026-10-24 (design doc section 10.5): one vessel, straight run,
# MAVLink driver straight to SITL, 12-core Windows host with Docker Desktop.

simulation_layer/kinematic:
  wind: unsupported
  waves: unsupported
  evidence: >-
    No environment model in ConcreteVessel.simulate (same as the spec declares).

kinematic_command_input:
  repeatability_tier: exact
  max_speedup: .inf
  evidence: >-
    ConcreteVessel.simulate closed-loop runs are bit-identical across repeats and across
    PYTHONHASHSEED values. 14,000 to 16,000 two-vessel steps per second on one core at a
    1 s step: over 10,000 times real time, limited only by the CPU.

usv_navigation_in_process:
  repeatability_tier: exact
  max_speedup: .inf
  evidence: >-
    WP5a, 2026-10-24, colav_automaton 54866f2: closed-loop runs of USV Navigation against a
    replaying target on the kinematic layer (head-on, crossing from starboard, crossing from
    port, overtaking; 1,000 steps at 1 s) are bit-identical across repeats and across
    processes with PYTHONHASHSEED 0, 1, 4242 and random (same state digests and run
    records). 1,350 to 2,000 two-vessel steps per second on one core (replay alone: 21,000
    to 23,000), so over 1,000 times real time, limited only by the CPU. About 80 percent of
    a step is the runtime's G11 guard (unsafe set and convex hull).

simulation_layer/ardupilot_sim:
  wind: unsupported
  waves: supported
  notes:
    wind: 5 m/s cross wind had no measurable effect on the SITL boat (end position within 1 cm)
  evidence: >-
    Wind of 5 m/s from the south left the end position within 1 cm of the calm run. Waves of
    0.5 m amplitude had a measurable effect (onset 0.9 s instead of 0.3 s, end position 0.9 m
    further). Wave realism is not validated.

sitl_internal_physics:
  repeatability_tier: bounded
  exact_up_to_speedup: 1
  max_speedup: 100
  deviation_bounds_m:
    1: 0.0
    5: 0.083
    20: 0.17
  evidence: >-
    ardupilot_sim with the ardupilot control layer: three repeats bit-identical at 1x. Max
    deviation 0.083 m at 5x and 0.17 m at 20x over 90 s of straight travel, caused by
    wall-clock command injection timing. Achieved 5.02x, 20.3x, 51.9x and 102.9x for
    requests of 5, 20, 50 and 100, so max_speedup is at least 100.

simulation_layer/gazebo:
  wind: supported
  waves: supported
  evidence: >-
    WP2, 2026-10-24: generated parametric hulls of 5, 30 and 100 m with a windage link under the
    WindEffects system, driven open loop over gz-transport without ArduPilot. A 5 m/s cross wind
    from the south on a vessel at rest heading east drifted it 2.12 m (5 m hull), 0.53 m (30 m)
    and 1.20 m (100 m) in 120 s, steady 0.018, 0.0045 and 0.010 m/s, against at most 0.003 m in
    the same runs without wind (open-loop runs repeat to the millimetre). Phase 0 had measured no
    effect because the hull had no wind-enabled link. Waves: Gazebo Harmonic 8.11 has no waves
    system at all (the commented-out gz-sim-waves-system does not exist); asv_wave_sim (gz-waves1)
    moved the 5 m hull 0.94 m in heave and 8.5 degrees in pitch peak to peak in 0.5 m, 5 s waves,
    but needs a renamed build to load next to the gz-sim Hydrodynamics system and finer buoyancy
    cells for waves shorter than a cell. Phase 2 WP2, 2026-10-26: the Gazebo image builds asv_wave_sim
    at ASV_WAVE_SIM_COMMIT with the Hydrodynamics system renamed WavesHydrodynamics, and hulls under
    waves get buoyancy cells of at most an eighth of the deep-water wavelength (up to 24 per side).
    Custom controller, straight replay from rest, 2 repeats, in 0.5 m, 5 s waves travelling east
    against calm water: heave 0.95 m (calm 0.004 m), pitch 9.0 degrees (0.10) and roll 1.1 degrees
    (0.10) peak to peak on the 5 m hull; 0.60 m (0.021 m) and 5.8 degrees (0.09) on the 30 m hull;
    1.01 m (0.016 m) and 0.15 degrees (0.06) on the 100 m hull, whose heave was not separated from its
    settling from rest. Cross-track error 1.18 m (calm 0.000 m) on the 5 m hull, 0.57 m (0.002 m) on
    the 30 m hull. Repeats stayed bit-identical; the finer cells slow the world (achieved 5.2x, 4.5x
    and 2.4x against 6.9x in calm water). Measured on the conda-forge Gazebo 8 stand-in image of a
    4-core Linux VM with the same asv_wave_sim commit and rename. 2026-10-27, the image's own build
    (OSRF packages, ./build.sh --simulation) on the 12-core Windows host with Docker Desktop, 5 m hull
    only, same run: heave 0.945 m (calm 0.002 m), pitch 8.97 degrees, roll 1.07 degrees and
    cross-track error 1.18 m, matching the stand-in; achieved 3.17x calm and 1.38x in waves. Calm
    repeats were bit-identical; in waves one repeat had 2 late thrust commands and the repeats ended
    0.001 m apart. The 30 and 100 m hulls were not re-run. Wave realism is not validated.

ardupilot_gazebo_plugin:
  repeatability_tier: bounded
  max_speedup: null
  host_max_speedup:
    phase0_windows_12_core: 4.4
  deviation_bounds_m:
    1: 0.47
    2: 0.41
    5: 0.54
  evidence: >-
    Phase 2 (WP3 parameters, see the Phase 2 block below for the method): repeats at 1x deviated by
    at most 0.27 m (turning, 30 m hull; 0.08, 0.02 and 0.01 m on the straight runs), within the
    Phase 0 bound. Tracking is not yet assurance grade: 1.3 to 1.6 m cross-track on straight legs
    at 5, 30 and 100 m, and after a turn the 5 m hull weaves (9.6 m on straight legs) and the
    100 m hull leaves the path (432 m). Phase 0: gazebo with the ardupilot control layer is not repeatable even at 1x (0.47 m over 85 s,
    2 repeats). Paced by Gazebo physics under the JSON lockstep backend: about 4.4x per
    instance on the 12-core host and about 7x in aggregate with two instances (the 5x
    request achieved 3.5x per instance with two in parallel). max_speedup is a per-host
    value; worker nodes measure and report their own in Phase 3. The vessel weaves (heading 45 to
    116 degrees, up to 24 m cross-track), so Gazebo runs were not assurance evidence until
    the control layer was tuned per vessel model (WP3).

# Phase 2 WP4 measurements, 2026-10-24 (design doc section 12.8): run_mavlink_replay against
# stacks generated by build_simulation_docker_stack_artifacts (SITL only, no MAVProxy or
# ArduAgent), pre-pin images c8c95ed2f641 (SITL) and 3a85aed5532e (Gazebo), one 5 m vessel,
# 3 concurrent repeats, scenario time 0 at SITL time 60 s, dt 1 s, same 12-core Windows host.

replay_mavlink_lockstep:
  repeatability_tier: bounded
  max_speedup: 50
  notes:
    max_speedup: the lockstep MAVLink link tracked 50x (51.4x achieved twice, 42.7x once under load); 100x gave 99.2x once and 58.8x once
  deviation_bounds_m_by_layer:
    simulation_layer/ardupilot_sim:
      1: 0.218
      5: 11.96
      20: 37.22
    simulation_layer/gazebo:
      1: 0.275
      2: 0.054
  evidence: >-
    Max distance between repeats at equal scenario time, the worst of the measured scenarios.
    Phase 2 (WP3 follower and parameters, method in the Phase 2 block below): ardupilot_sim
    0.22 m at 1x, 11.96 m at 5x and 37.2 m at 20x, each time in the 100 m turning run (1290 s);
    the 5 and 30 m runs stayed within 0.06 m at 1x (both turning runs bit-identical), 0.79 m at
    5x and 3.7 m at 20x, and the 100 m straight run within 0.10 m at 20x. SITL's motorboat does
    not take the vessel's size: one PWM microsecond of rudder is an 845 m turning circle, so the
    100 m hull drifts wide in its port turn (about 190 m) by a different amount in each repeat.
    gazebo with the ardupilot control layer at 1x: 0.27 m (turning, 30 m hull). The 1 m mode
    switch behind the WP4 value of 12.85 m at 20x is gone (WP3). WP4, before WP3, 90 s of
    straight travel: ardupilot_sim 0.005 m at 1x, 0.071 m at 5x and 0.311 m at 20x; gazebo
    0.184 m at 1x and 0.054 m at 2x (0.98x and 1.78x achieved with three instances on the
    12-core host).

# Phase 2 measurements, 2026-10-26 (WP2, WP3, WP5b, WP5c, WP6, WP7): scripts/calibrate.py stack
# against stacks generated by build_simulation_docker_stack_artifacts, the reference runs of
# calibration/reference_scenarios.py (straight 90 s; turning 120, 300 and 1290 s) with 5, 30 and
# 100 m vessels starting from rest, 2 concurrent repeats, dt 1 s, on a 4-core Linux VM
# (phase2_linux_vm_4_core). SITL ran the pinned scenegems-ardupilot-sitl image. Gazebo ran a
# conda-forge Gazebo 8 stand-in of deploy/images/gazebo with the same upstream pins and the same
# rename of asv_wave_sim, because the OSRF packages were not reachable from that VM.

gz_transport_actuator:
  repeatability_tier: bounded
  max_speedup: null
  host_max_speedup:
    phase2_linux_vm_4_core: 5.9
  deviation_bounds_m:
    1: 0.25
  evidence: >-
    The custom controller on gazebo: replay of the straight and turning runs, USV Navigation on
    the straight run, and the straight runs under 0.5 m 5 s waves. Repeats were bit-identical
    (one digest over the odometry bits of every control step) in all but one measurement. In the
    100 m turning run (1290 s) gz sim handled 9 and 1 thrust commands one physics iteration late
    under CPU load, and those repeats deviated by up to 0.25 m; the actuator reports every late
    thruster. The runner steps the paused world as fast as it goes, 5.9x to 9.2x with two
    instances on 4 cores in calm water and 2.4x to 5.2x under waves (finer buoyancy cells); the
    workbench paces it to the requested speedup, and the bound holds at any request up to that
    pace. Wind of 5 m/s from the south on the straight runs moved the hulls 0.13, 0.03 and 0.22 m
    off the path (calm 0.000, 0.002 and 0.05 m) with repeats still bit-identical, so the custom
    controller keeps the gazebo layer's wind support.

custom_controller_waypoint_follower:
  repeatability_tier: exact
  max_speedup: .inf
  evidence: >-
    The line-of-sight waypoint follower and the twin-thrust autopilot run in process in the
    runner and are pure functions of the odometry they get: the gazebo repeats were bit-identical
    whenever no thrust arrived late. Tracking on gazebo from rest: within 0.05 m on the straight
    runs at 5, 30 and 100 m; on the turning runs 1.12, 0.47 and 0.48 m on straight legs and 5.5,
    7.1 and 10.7 m anywhere, without orbits. Its pace is the actuator's.

custom_controller_heading_speed_input:
  repeatability_tier: exact
  max_speedup: .inf
  evidence: >-
    USV Navigation stepped in the runner next to the custom controller (WP5c): on gazebo from
    rest the straight runs at 5, 30 and 100 m were bit-identical between repeats (7.1x, 7.8x and
    5.9x achieved). Its pace is the actuator's.

usv_navigation_mavlink_lockstep:
  repeatability_tier: bounded
  max_speedup: 20
  notes:
    max_speedup: measured at 20x only (20.2x to 20.3x achieved); the same link with the replay follower tracked 50x
  deviation_bounds_m_by_layer:
    simulation_layer/ardupilot_sim:
      20: 0.313
    simulation_layer/gazebo:
      1: 0.325
  evidence: >-
    USV Navigation toward the end of the straight run, from rest (WP5b). ardupilot_sim at 20x:
    0.31, 0.034 and 0.011 m between repeats at 5, 30 and 100 m. gazebo with the ardupilot control
    layer at 1x: 0.072, 0.32 and 0.012 m. USV Navigation steers to the goal rather than along the
    reference, so its cross-track error is not a tracking measure here.

mission_planner_gcs_port:
  evidence: >-
    Interactive only, so no tier or pace is measured. Checked live on ardupilot_sim and on gazebo
    with one Mission Planner vessel: the ground station port read through the session stack's
    ComposeProject.published_port stayed the same before SITL booted, while MAVProxy retried and
    after boot, and a MAVLink client on it got the vessel's heartbeat, a COMMAND_ACK to a request
    and its position stream. The workbench's lockstep driver ran an attended 60 s head-on instance
    of a replay vessel and a Mission Planner vessel on both layers: the replay vessel, starting
    from rest, ended 8.5 m (ardupilot_sim) and 3.0 m (gazebo) from the end of its reference, and
    the Mission Planner vessel was watched but not commanded.
