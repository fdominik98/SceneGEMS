UnspecifiedVesselType:
    min_length: 10.0 # Minimum vessel length in meters
    max_length: 400.0 # Maximum vessel length in meters
    min_beam: 2.0 # Minimum vessel beam (width) in meters
    max_beam: 80.0 # Maximum vessel beam (width) in meters
    max_speed: 25.722235 # Maximum vessel speed: 50.0 knots in m/s
    max_angular_speed: 0.03   # ~1.7 deg/s. Maximum angular speed in radians per second
    max_acceleration: 0.3  # generic upper bound. Maximum acceleration in meters per second squared
    steering_type: rudder # How the vessel turns: rudder, skid (two propellers, thrust difference) or vectored_thrust (one turnable engine)
    block_coefficient: 0.65 # Hull fullness: displaced volume over length * beam * draft
    length_to_beam: 6.5 # Length over beam; the beam of a vessel follows from its length, within the beam range
    beam_to_draft: 3.0 # Beam over draft


