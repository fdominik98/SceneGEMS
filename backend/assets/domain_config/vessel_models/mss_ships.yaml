# Preset vessel models taken from the Marine Systems Simulator (MSS, https://github.com/cybergalactic/MSS, MIT license).
#
# A preset is a named set of values for the generated Gazebo vessel model
# (simulation_layers/gazebo/generators/vessel_dynamics.py). It can be chosen for a vessel before a
# simulation when the vessel has the preset's steering type and lies within its bounds; the
# default is the automatic model. A chosen preset keeps the vessel's own length, breadth, draft
# and limits, and replaces the hull and steering assumptions listed under `dynamics`.
#
# Per preset:
#   name, source      what it is and where the numbers come from
#   steering_type     rudder, skid or vectored_thrust; the vessel must have the same
#   particulars       the source ship's own numbers, for the record (SI units; not applied)
#   bounds            [low, high] for the vessel's length, breadth, draft (m), max_speed (m/s) and
#                     max_angular_speed (rad/s); a bound left out is not checked
#   dynamics          vessel dynamics override keys (see ../vessel_dynamics/vessel_dynamics.yaml)
#   notes             what the preset does not take from its source
#
# Only numbers stated in the source files are used. The MSS models themselves (their nonlinear
# hydrodynamic derivatives) are not ported: a preset gives the generated model the ship's hull
# fullness and steering gear, not its full manoeuvring model.

mariner:
    name: Mariner class cargo ship
    source: "MSS CRAFT/SHIP/models/mariner.m; Chislett and Stroem-Tejsen (1965), Planar motion mechanism tests and full-scale steering and maneuvering predictions for a Mariner class vessel"
    steering_type: rudder
    particulars:
        length: 160.93
        speed: 7.7175 # 15 knots, the model's nominal speed
        rudder_max_angle_deg: 40.0
        rudder_rate_deg_s: 5.0
    bounds:
        length: [137.0, 185.0]
        max_speed: [6.0, 13.0]
    dynamics:
        rudder_max_angle_deg: 40.0
        rudder_rate_deg_s: 5.0
    notes: "The source file states neither breadth, draft nor displacement, so the hull fullness stays the vessel's own."

container_ship_175:
    name: High speed container ship, 175 m
    source: "MSS CRAFT/SHIP/models/container.m; Son and Nomoto (1982), On the coupled motion of steering and rolling of a high speed container ship"
    steering_type: rudder
    particulars:
        length: 175.0
        breadth: 25.4
        draft: 8.5 # 8.0 forward, 9.0 aft
        displaced_volume: 21222.0
        rudder_area: 33.0376
        propeller_diameter: 6.533
        rudder_max_angle_deg: 10.0 # the limit the model is valid for
        rudder_rate_deg_s: 5.0
    bounds:
        length: [149.0, 201.0]
        breadth: [21.6, 29.2]
        draft: [6.0, 10.6]
    dynamics:
        block_coefficient: 0.5617 # 21222 / (175 * 25.4 * 8.5)
        rudder_area_ratio: 0.02221 # 33.0376 / (175 * 8.5)
        rudder_rate_deg_s: 5.0
    notes: "The source limits the rudder to 10 degrees, the range its model is valid for; the generated model keeps the usual 35 degrees. The roll coupling of the source model is not ported."

tanker_190000_dwt:
    name: Esso 190,000 dwt tanker
    source: "MSS CRAFT/SHIP/models/tanker.m; Van Berlekom and Goddard (1972), Maneuvering of large tankers"
    steering_type: rudder
    particulars:
        length: 304.8
        draft: 18.46
        speed: 8.23 # 16 knots
        propeller_speed_rpm: 80.0
        rudder_max_angle_deg: 10.0 # the limit the model is valid for
        rudder_rate_deg_s: 2.33
    bounds:
        length: [259.0, 350.0]
        draft: [13.0, 23.0]
        max_speed: [6.5, 10.5]
    dynamics:
        rudder_rate_deg_s: 2.33
    notes: "The source file states neither breadth nor displacement, so the hull fullness stays the vessel's own. Its shallow water terms are not ported."

offshore_supply_vessel:
    name: Offshore supply vessel, 83 m
    source: "MSS CRAFT/SHIP/models/osv.m; Fossen, Handbook of marine craft hydrodynamics and motion control"
    steering_type: vectored_thrust
    particulars:
        length: 83.0
        breadth: 18.0
        draft: 5.0
        block_coefficient: 0.65
        speed: 7.7 # max cruise speed
        azimuth_thrusters: 2 # at the stern, 420 kN and 655 kN
        tunnel_thrusters: 2 # at the bow, 300 kN each
    bounds:
        length: [70.0, 96.0]
        breadth: [15.3, 20.7]
        draft: [3.5, 6.3]
        max_speed: [4.0, 9.0]
    dynamics:
        block_coefficient: 0.65
    notes: "The two azimuth thrusters at the stern become the one vectored thruster of the generated model; the bow tunnel thrusters are left out."

naval_vessel:
    name: Multipurpose naval vessel, 51.5 m
    source: "MSS CRAFT/SHIP/models/navalvessel.m; Blanke and Christensen (1993), Rudder-roll damping autopilot robustness to sway-yaw-roll couplings"
    steering_type: rudder
    particulars:
        length: 51.5
        breadth: 8.6
        draft: 2.3
        displaced_volume: 357.0
        speed: 8.0 # about 15 knots
    bounds:
        length: [43.0, 60.0]
        breadth: [7.3, 9.9]
        draft: [1.6, 2.9]
        max_speed: [5.0, 14.0]
    dynamics:
        block_coefficient: 0.3505 # 357 / (51.5 * 8.6 * 2.3)
    notes: "The roll coupling of the source model is not ported."

otter_usv:
    name: Maritime Robotics Otter USV
    source: "MSS CRAFT/USV/models/otter.m; Fossen, Handbook of marine craft hydrodynamics and motion control"
    steering_type: skid
    particulars:
        length: 2.0
        breadth: 1.08
        draft: 0.134 # 0.195 with a 25 kg payload
        mass: 55.0 # up to 45 kg of payload on top
        speed: 3.09 # 6 knots
        propellers: 2 # 0.395 m to each side
        max_thrust_per_propeller: 119.7
    bounds:
        length: [1.6, 2.4]
        breadth: [0.9, 1.3]
        draft: [0.09, 0.25]
        max_speed: [0.5, 3.6]
    dynamics:
        block_coefficient: 0.19 # 55 kg / (1025 * 2.0 * 1.08 * 0.134): two slender pontoons in the box of the whole craft
        thruster_beam_ratio: 0.7315 # 0.395 / (1.08 / 2)
    notes: "The Otter is a catamaran; the generated model is one hull of the same displacement, so its roll behaviour differs."
