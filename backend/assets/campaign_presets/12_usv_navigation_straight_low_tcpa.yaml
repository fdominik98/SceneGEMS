# Shipped with the control node image: a campaign preset (scenegems_tool/assurance/campaign/campaign_presets.py).
format: 3
name: "USV Navigation on straight trajectories with low TCPA"
description: >-
  One case of each of the seven two-vessel FECs without obstacles, its scene generated with a low
  TCPA enforced. The other vessel goes straight on while USV Navigation steers the own ship on the
  kinematic layer, and the post hoc monitor judges the scenes, the trajectories and the run.
steps: [scene_generation, trajectory_generation, simulation]
scope:
  - patterns: [2vessel_0obstacle_scenarios]
    quota: 1
    failure_budget: 1
domain:
  scene_generation_timeout_s: 60
  enforce_low_tcpa: true
scene_generation:
  monitor: post_hoc
trajectories:
  generator: straight
  timespan_s: 3600
  timeout_s: 1800
  monitor: post_hoc
execution:
  runs:
    - name: usv navigation own ship
      stack: {simulation_layer: kinematic, mode: usv_navigation}
      repeats: 1
      monitor: post_hoc
policy:
  retention: all
  seed: 20261029
