# Shipped with the control node image: a campaign preset (scenegems_tool/assurance/campaign/campaign_presets.py).
format: 3
name: "MOOS-IvP against the planned trajectories"
description: >-
  Three cases of every two-vessel FEC, each simulated twice on the kinematic layer: once replaying
  the planned trajectories and once with MOOS-IvP's helm steering the own ship with its COLREGS
  behaviour. Comparing the verdicts of the two runs shows where the helm departs from a compliant
  plan. The worker node needs the MOOS-IvP layer (asv_system/moos_ivp).
steps: [scene_generation, trajectory_generation, simulation]
scope:
  - patterns: [2vessel_*_scenarios]
    quota: 3
    failure_budget: 3
domain:
  scene_generation_timeout_s: 120
  enforce_low_tcpa: false
trajectories:
  generator: monitor_driven_rrt
  timeout_s: 1800
execution:
  runs:
    - name: planned trajectories
      stack: {simulation_layer: kinematic, mode: replay}
      repeats: 1
      monitor: post_hoc
    - name: moos-ivp own ship
      stack: {simulation_layer: kinematic, mode: moos_ivp}
      repeats: 1
      monitor: post_hoc
policy:
  retention: all
  seed: 20261113
