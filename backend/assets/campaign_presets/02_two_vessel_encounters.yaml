# Shipped with the master image: a campaign preset (scenegems_tool/assurance/campaign/campaign_presets.py).
format: 3
name: "Two-vessel encounters on the kinematic layer"
description: >-
  Five cases of every two-vessel FEC, with and without a static obstacle (14 FECs, 70 cases),
  through the whole chain with a kinematic replay and the post hoc monitor. The everyday
  regression run for head-on, crossing and overtaking situations.
steps: [scene_generation, trajectory_generation, simulation]
scope:
  - patterns: [2vessel_*_scenarios]
    quota: 5
    failure_budget: 5
domain:
  scene_generation_timeout_s: 60
  enforce_low_tcpa: false
trajectories:
  generator: monitor_driven_rrt
  timeout_s: 1800
execution:
  runs:
    - name: kinematic replay
      stack: {simulation_layer: kinematic, mode: replay}
      repeats: 1
      monitor: post_hoc
policy:
  retention: all
  seed: 20261029
