# Shipped with the master image: a campaign preset (scenegems_tool/assurance/campaign/campaign_presets.py).
format: 2
name: "USV Navigation against the planned trajectories"
description: >-
  Three cases of every two- and three-vessel class, each simulated twice on the kinematic layer:
  once replaying the planned trajectories and once with USV Navigation steering the own ship.
  Comparing the verdicts of the two runs shows where the controller departs from a compliant plan.
steps: [scene_generation, trajectory_generation, simulation]
scope:
  - patterns: [2vessel_*_scenarios, 3vessel_*_scenarios]
    quota: 3
    failure_budget: 3
domain:
  scene_generation_timeout_s: 120
  enforce_low_tcpa: false
trajectories:
  generator: monitor_driven_rrt
  timeout_s: 1800
execution:
  runs:
    - name: planned trajectories
      stack: {simulation_layer: kinematic, mode: replay}
      repeats: 1
      monitor: post_hoc
    - name: usv navigation own ship
      stack: {simulation_layer: kinematic, mode: usv_navigation}
      repeats: 1
      monitor: post_hoc
policy:
  retention: all
  seed: 20261029
