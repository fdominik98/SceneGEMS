# Shipped with the master image: a campaign preset (scenegems_tool/assurance/campaign/campaign_presets.py).
format: 3
name: "Gazebo replay of two-vessel encounters"
description: >-
  One case of every two-vessel FEC without obstacles replayed on ArduPilot SITL against a Gazebo
  world at five times real time, judged by the post hoc monitor. Needs nodes that offer the Gazebo
  simulation.
steps: [scene_generation, trajectory_generation, simulation]
scope:
  - patterns: [2vessel_0obstacle_scenarios]
    quota: 1
    failure_budget: 2
domain:
  scene_generation_timeout_s: 60
  enforce_low_tcpa: false
trajectories:
  generator: monitor_driven_rrt
  timeout_s: 1800
execution:
  runs:
    - name: gazebo replay
      stack: {simulation_layer: gazebo, mode: replay, speedup: 5}
      repeats: 1
      monitor: post_hoc
policy:
  retention: all
  seed: 20261029
