# One worker node instance of one control node: the worker node daemon (scenegems_tool.cluster.worker_node.daemon) in its
# container. It holds the Docker socket and starts every job in a subsystem container next to it.
# The deployment tool installs this file with .env into one folder per worker node
# (scenegems_tool.cluster.release.roles) and runs `docker compose up -d` there.
#
# The values come from .env (template: deploy/worker_node/.env.example). The project, the container,
# the network and the volumes are all named scenegems-worker-node-<control node id>-<worker node name>, so one
# machine can run worker nodes for several control nodes, and several worker nodes of one control node, side by side.
# The worker node needs no control node to start: it dials SCENEGEMS_CONTROL_NODE_URL and retries until the control node is up.
# Control node and worker nodes trust the VPN, so there is nothing to pair. The cache of downloaded artifacts
# lives in the state volume.
name: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID:?set SCENEGEMS_CONTROL_NODE_ID in the env file}-${SCENEGEMS_WORKER_NODE_NAME:?set SCENEGEMS_WORKER_NODE_NAME in the env file}

services:
  worker-node:
    image: scenegems-worker-node:${SCENEGEMS_IMAGE_TAG:-latest}
    container_name: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID}-${SCENEGEMS_WORKER_NODE_NAME}
    restart: unless-stopped
    # Time for running jobs to stop, remove their containers and give their leases back.
    stop_grace_period: 60s
    environment:
      SCENEGEMS_CONTROL_NODE_URL: ${SCENEGEMS_CONTROL_NODE_URL:?set SCENEGEMS_CONTROL_NODE_URL in the env file}
      SCENEGEMS_CONTROL_NODE_ID: ${SCENEGEMS_CONTROL_NODE_ID}
      SCENEGEMS_BROKER_PORT: ${SCENEGEMS_BROKER_PORT:-1883}
      SCENEGEMS_WORKER_NODE_NAME: ${SCENEGEMS_WORKER_NODE_NAME}
      SCENEGEMS_WORKER_NODE_MACHINE: ${SCENEGEMS_WORKER_NODE_MACHINE:-}
      SCENEGEMS_WORKER_NODE_SLOTS: ${SCENEGEMS_WORKER_NODE_SLOTS:?set SCENEGEMS_WORKER_NODE_SLOTS in the env file}
      SCENEGEMS_WORKER_NODE_COMPONENTS: ${SCENEGEMS_WORKER_NODE_COMPONENTS:?set SCENEGEMS_WORKER_NODE_COMPONENTS in the env file}
      SCENEGEMS_WORKER_NODE_LABELS: ${SCENEGEMS_WORKER_NODE_LABELS:-}
      SCENEGEMS_WORKER_NODE_REFERENCE_GEOFENCE: ${SCENEGEMS_WORKER_NODE_REFERENCE_GEOFENCE:-}
      SCENEGEMS_SOFTWARE_REVISION: ${SCENEGEMS_SOFTWARE_REVISION:-}
      # The tag of the images the worker node's jobs run in, the release's (utils/image_names.py)
      SCENEGEMS_IMAGE_TAG: ${SCENEGEMS_IMAGE_TAG:-latest}
      SCENEGEMS_WORKER_NODE_ARTIFACT_CACHE_MAX_BYTES: ${SCENEGEMS_WORKER_NODE_ARTIFACT_CACHE_MAX_BYTES:-2147483648}
      # Paths inside this container and the Docker names job containers use; not for the env file.
      SCENEGEMS_WORKER_NODE_STATE_DIR: /var/lib/scenegems-worker-node
      SCENEGEMS_WORKER_NODE_ARTIFACT_CACHE_DIR: /var/lib/scenegems-worker-node/artifacts
      SCENEGEMS_DOCKER_NETWORK: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID}-${SCENEGEMS_WORKER_NODE_NAME}
      SCENEGEMS_RUNTIME_VOLUME: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID}-${SCENEGEMS_WORKER_NODE_NAME}-runtime
      # Subsystem images; empty means scenegems-<subsystem>:<SCENEGEMS_IMAGE_TAG> (scenegems_tool/cluster/worker_node/subsystem.py).
      SCENE_GENERATION_IMAGE: ${SCENE_GENERATION_IMAGE:-}
      TRAJECTORY_GENERATION_IMAGE: ${TRAJECTORY_GENERATION_IMAGE:-}
      MONITORING_IMAGE: ${MONITORING_IMAGE:-}
      SIMULATION_IMAGE: ${SIMULATION_IMAGE:-}
      DESIGN_SPACE_EXPLORATION_IMAGE: ${DESIGN_SPACE_EXPLORATION_IMAGE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Generated compose files and stack files of the worker node's instances; SITL and Gazebo mount it too.
      - runtime:/app/assets/runtime_assets
      - state:/var/lib/scenegems-worker-node
    networks:
      - worker-node
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Pooled services join this network; it is removed with the worker node.
networks:
  worker-node:
    name: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID}-${SCENEGEMS_WORKER_NODE_NAME}

volumes:
  runtime:
    name: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID}-${SCENEGEMS_WORKER_NODE_NAME}-runtime
  state:
    name: scenegems-worker-node-${SCENEGEMS_CONTROL_NODE_ID}-${SCENEGEMS_WORKER_NODE_NAME}-state
